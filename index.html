<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя ❤️</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    font-family: 'Segoe UI', -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  /* Плавающие сердечки на фоне */
  .heart {
    position: absolute;
    color: rgba(255, 255, 255, 0.6);
    font-size: 24px;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
    50% { transform: translateY(-30px) rotate(15deg); opacity: 1; }
  }

  .card {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 30px;
    padding: 50px 30px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255, 105, 135, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.5);
    max-width: 400px;
    width: 100%;
    animation: fadeIn 1.5s ease-out;
    z-index: 10;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  .big-heart {
    font-size: 80px;
    display: inline-block;
    animation: beat 1.2s ease-in-out infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
  }

  h1 {
    color: #e91e63;
    font-size: 42px;
    margin: 15px 0 20px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
  }

  p {
    color: #c2185b;
    font-size: 18px;
    line-height: 1.6;
    font-style: italic;
  }

  /* Адаптив для маленьких экранов */
  @media (max-width: 400px) {
    h1 { font-size: 34px; }
    .big-heart { font-size: 65px; }
    .card { padding: 40px 20px; }
    p { font-size: 16px; }
  }
</style>
</head>
<body>

  <!-- Фон: плавающие сердечки -->
  <span class="heart" style="top: 10%; left: 15%; animation-delay: 0s;">❤️</span>
  <span class="heart" style="top: 20%; left: 80%; animation-delay: 1s;">💕</span>
  <span class="heart" style="top: 70%; left: 10%; animation-delay: 2s;">💖</span>
  <span class="heart" style="top: 80%; left: 75%; animation-delay: 0.5s;">💗</span>
  <span class="heart" style="top: 45%; left: 90%; animation-delay: 1.5s;">❤️</span>
  <span class="heart" style="top: 55%; left: 5%; animation-delay: 2.5s;">💓</span>

  <div class="card">
    <div class="big-heart">❤️</div>
    <h1>I love you</h1>
    <p>Ты — самое лучшее, что случилось в моей жизни 💫</p>
  </div>

</body>
</html>
